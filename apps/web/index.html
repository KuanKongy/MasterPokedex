<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MasterPokédex</title>
    <meta name="description" content="National Pokedex with Regions, Routes and Trainers" />
    <meta name="author" content="Saikou" />
    <meta name="theme-color" content="#E3350D" />

    <!-- The app's only icon: one drawing at 16, 32 and 48 in one file, so
         nothing larger can be picked and shrunk in its place and no size shows
         a different ball. Written root-relative, which Vite
         rewrites to /MasterPokedex/favicon.ico in both the dev server and the
         build: an absolute URL of our own gets the base put in front of it a
         second time, and a relative one would resolve against the route when
         404.html serves this page at a deep URL. Bump ?v= after redrawing it:
         Chrome keeps favicons in a store of its own that clearing the cache
         does not empty, so only a new URL is certain to be fetched.
         Regenerate with: node apps/web/scripts/generate-brand-assets.mjs -->
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico?v=4" />

    <!-- Crawlers need absolute URLs, so the card is served from public/ at a fixed path. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MasterPokedex" />
    <meta property="og:title" content="MasterPokedex" />
    <meta property="og:description" content="National Pokedex with Regions, Routes and Trainers" />
    <meta property="og:url" content="https://kuankongy.github.io/MasterPokedex/" />
    <meta property="og:image" content="https://kuankongy.github.io/MasterPokedex/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MasterPokédex title in pixel type, ringed by Pokémon type-colored blocks and Poké Balls" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MasterPokedex" />
    <meta name="twitter:description" content="National Pokedex with Regions, Routes and Trainers" />
    <meta name="twitter:image" content="https://kuankongy.github.io/MasterPokedex/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Mirror the stored Poké Ball theme and art before hydration (next-themes
         does the same for dark mode) so the chrome never flashes the default. -->
    <script>try{var b=localStorage.getItem('masterpokedex.ballStyle');if(b)document.documentElement.dataset.ball=b;var a=localStorage.getItem('masterpokedex.ballArt');if(a)document.documentElement.dataset.ballArt=a}catch(e){}</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
