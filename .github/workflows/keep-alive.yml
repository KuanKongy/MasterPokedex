# Pings the deployed API's /health every six hours. /health runs `select 1`
# against Postgres on purpose, so this single request keeps both the Railway
# service warm and the Supabase free-tier project from pausing (which happens
# after ~7 days without traffic). `-f` turns downtime into a red run.
#
# Setup: Actions secret API_HEALTH_URL = https://<service>.up.railway.app/health
# Note: GitHub disables cron workflows after ~60 days without repo activity —
# re-enable from the Actions tab if the badge goes grey.
name: Keep-alive

on:
  schedule:
    - cron: '23 */6 * * *' # off the hour to dodge scheduler congestion
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API /health
        run: curl -fsS --max-time 30 --retry 3 --retry-delay 10 "${{ secrets.API_HEALTH_URL }}"
